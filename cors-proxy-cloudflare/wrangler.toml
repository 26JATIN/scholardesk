name = "scholardesk-cors-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Free tier: 100,000 requests/day
# Workers Unlimited: $5/month (10M requests/day)

# Optional: Enable KV for persistent cookie storage across edge instances
# [[kv_namespaces]]
# binding = "SESSION_COOKIES"
# id = "YOUR_KV_ID"

# Optional: Add custom domain
# [routes]
# pattern = "proxy.yourdomain.com"
# zone_name = "yourdomain.com"